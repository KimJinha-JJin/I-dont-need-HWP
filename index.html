<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HWP → HTML 변환기</title>
  <script src="https://cdn.jsdelivr.net/npm/cfb@1/dist/cfb.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      color: #1e293b;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 { font-size: 1.75rem; font-weight: 700; color: #1e293b; }
    header p  { margin-top: 6px; color: #64748b; font-size: 0.95rem; }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
      width: 100%;
      max-width: 680px;
      padding: 32px;
    }

    /* ── Drop zone ── */
    #dropzone {
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    #dropzone:hover, #dropzone.drag-over {
      border-color: #2563eb;
      background: #eff6ff;
    }
    #dropzone svg { color: #94a3b8; margin-bottom: 12px; }
    #dropzone p.main { font-size: 1rem; font-weight: 600; color: #475569; }
    #dropzone p.sub  { margin-top: 4px; font-size: 0.85rem; color: #94a3b8; }
    #fileInput { display: none; }

    /* ── Status ── */
    #status {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    #status.loading { background: #eff6ff; color: #1d4ed8; display: flex; }
    #status.error   { background: #fef2f2; color: #dc2626; display: flex; }
    #status.success { background: #f0fdf4; color: #15803d; display: flex; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Result ── */
    #result { display: none; margin-top: 24px; }

    .meta-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .meta-chip {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.82rem;
      color: #475569;
    }
    .meta-chip strong { color: #1e293b; }

    .preview-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
    }
    #preview {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      height: 300px;
      overflow: auto;
      background: #fff;
    }
    #preview iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    .btn-primary   { background: #2563eb; color: #fff; }
    .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

    .google-hint {
      margin-top: 16px;
      padding: 12px 16px;
      background: #fafafa;
      border-left: 3px solid #2563eb;
      border-radius: 0 8px 8px 0;
      font-size: 0.83rem;
      color: #475569;
      line-height: 1.6;
    }
    .google-hint strong { color: #1e293b; }
  </style>
</head>
<body>

<header>
  <h1>HWP → HTML 변환기</h1>
  <p>설치 없이 브라우저에서 바로 변환 · 파일은 내 컴퓨터 안에서만 처리됩니다</p>
</header>

<div class="card">
  <div id="dropzone" role="button" tabindex="0"
       onclick="document.getElementById('fileInput').click()"
       ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)"
       onkeydown="if(event.key==='Enter'||event.key===' ')document.getElementById('fileInput').click()">
    <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
    </svg>
    <p class="main">HWP 파일을 여기에 드래그하거나 클릭해서 선택</p>
    <p class="sub">HWP 5.0 · HWPX 지원</p>
  </div>
  <input type="file" id="fileInput" accept=".hwp,.hwpx" onchange="onFileSelected(event)">

  <div id="status"></div>
  <div id="result">
    <div class="meta-row" id="metaRow"></div>
    <div class="preview-label">미리보기</div>
    <div id="preview"><iframe id="previewFrame" sandbox="allow-same-origin"></iframe></div>
    <div class="actions">
      <button class="btn-primary" onclick="downloadHtml()">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
        </svg>
        HTML 다운로드
      </button>
      <button class="btn-secondary" onclick="resetApp()">다른 파일 변환</button>
    </div>
    <div class="google-hint">
      <strong>Google Docs로 가져오기:</strong><br>
      다운로드한 HTML 파일을 Google Drive에 업로드 →
      파일 우클릭 → <strong>"Google 문서로 열기"</strong>
    </div>
  </div>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────
// HWP 태그 상수
// ─────────────────────────────────────────────
const TAG_PARA_HEADER = 66;
const TAG_PARA_TEXT   = 67;
const TAG_LIST_HEADER = 71;
const TAG_TABLE       = 76;
const TAG_STYLE       = 26;

const HEADING_MAP = {
  '제목': 1, 'Title': 1,
  '소제목': 2,
  '개요 1': 2, 'Heading 1': 2,
  '개요 2': 3, 'Heading 2': 3,
  '개요 3': 4, 'Heading 3': 4,
  '개요 4': 5, 'Heading 4': 5,
  '개요 5': 6, 'Heading 5': 6,
};

// ─────────────────────────────────────────────
// 압축 해제 (deflate-raw = zlib wbits -15)
// ─────────────────────────────────────────────
async function decompressRaw(data) {
  try {
    const ds = new DecompressionStream('deflate-raw');
    const writer = ds.writable.getWriter();
    writer.write(data);
    writer.close();

    const chunks = [];
    const reader = ds.readable.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
    }

    const total = chunks.reduce((s, c) => s + c.length, 0);
    const out = new Uint8Array(total);
    let off = 0;
    for (const c of chunks) { out.set(c, off); off += c.length; }
    return out;
  } catch {
    return data; // 압축 안 된 경우 그대로 반환
  }
}

// ─────────────────────────────────────────────
// 레코드 파싱
// ─────────────────────────────────────────────
function* iterRecords(buf) {
  let i = 0;
  const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  while (i + 4 <= buf.length) {
    const header = view.getUint32(i, true);
    const tag    = header & 0x3FF;
    let   size   = (header >> 14) & 0xFFF;
    i += 4;
    if (size === 0xFFF) {
      if (i + 4 > buf.length) break;
      size = view.getUint32(i, true);
      i += 4;
    }
    const data = buf.slice(i, i + size);
    i += size;
    yield { tag, level: (header >> 10) & 0xF, data };
  }
}

// ─────────────────────────────────────────────
// 스타일 이름 파싱 (DocInfo)
// ─────────────────────────────────────────────
function parseStyles(buf) {
  const styles = {};
  const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let idx = 0;
  for (const rec of iterRecords(buf)) {
    if (rec.tag === TAG_STYLE && rec.data.length >= 2) {
      const rv = new DataView(rec.data.buffer, rec.data.byteOffset, rec.data.byteLength);
      const nameLen = rv.getUint16(0, true);
      if (2 + nameLen * 2 <= rec.data.length) {
        styles[idx] = new TextDecoder('utf-16le').decode(rec.data.slice(2, 2 + nameLen * 2));
      }
      idx++;
    }
  }
  return styles;
}

// ─────────────────────────────────────────────
// 단락 텍스트 추출
// ─────────────────────────────────────────────
function extractParaText(data) {
  const chars = [];
  for (let i = 0; i + 1 < data.length; i += 2) {
    const rv = new DataView(data.buffer, data.byteOffset + i, 2);
    const code = rv.getUint16(0, true);
    if (code === 0x0D || code === 0x0A) {
      chars.push('\n');
    } else if (code === 0x09) {
      chars.push('\t');
    } else if (code === 0x1E) {
      chars.push('\x1E'); // 이미지 자리 표시자 (나중에 img 태그로 치환)
      i += 14;
    } else if (code >= 0x01 && code <= 0x1F) {
      i += 14; // 인라인 오브젝트 7 words 스킵 (루프에서 +2 추가됨 → 총 16 bytes)
    } else {
      chars.push(String.fromCharCode(code));
    }
  }
  return chars.join('');
}

// ─────────────────────────────────────────────
// 섹션 파싱 (문서 순서 보존)
// ─────────────────────────────────────────────
function parseSection(buf, styles, images = []) {
  const content = [];
  let currentStyleIdx = 0;
  // 스택 기반: 테이블이 중첩되어도 동작
  // 각 항목: { table, cell, cellIndex, tableLevel }
  const stack = [];
  let imgIdx = 0;

  for (const { tag, level, data } of iterRecords(buf)) {
    // tableLevel이 확정된 스택 항목에 대해 레벨 기반 탈출
    while (stack.length > 0) {
      const top = stack[stack.length - 1];
      if (top.tableLevel === null) break;           // 아직 첫 LIST_HEADER 미도달
      if (level < Math.max(top.tableLevel, 1)) {    // tableLevel=0 엣지케이스 방어
        stack.pop();
      } else {
        break;
      }
    }
    // 추가 안전망: PARA_HEADER가 나타나면 최상위 스택 항목의 tableLevel과 같거나 낮은 경우 탈출
    if (tag === TAG_PARA_HEADER && stack.length > 0) {
      const top = stack[stack.length - 1];
      if (top.tableLevel !== null && level <= top.tableLevel) {
        stack.pop();
      }
    }
    const ctx = stack.length > 0 ? stack[stack.length - 1] : null;

    if (tag === TAG_PARA_HEADER) {
      currentStyleIdx = data.length >= 10 ? data[8] : 0;

    } else if (tag === TAG_PARA_TEXT) {
      let text = extractParaText(data);
      // 이미지 자리 표시자를 실제 img 태그로 치환
      if (text.includes('\x1E') && images.length > 0) {
        text = text.replace(/\x1E/g, () => {
          const img = images[imgIdx % images.length];
          imgIdx++;
          return img ? `\x02IMG:${img}\x03` : '[이미지]';
        });
      } else {
        text = text.replace(/\x1E/g, '[이미지]');
      }

      if (ctx && ctx.cell) {
        ctx.cell.text += text;
      } else if (!ctx) {
        content.push({ type: 'paragraph', text, style: styles[currentStyleIdx] || '' });
      }

    } else if (tag === TAG_TABLE) {
      if (data.length >= 8) {
        const rv = new DataView(data.buffer, data.byteOffset, data.byteLength);
        const rows = rv.getUint16(4, true);
        const cols = rv.getUint16(6, true);
        const table = { type: 'table', rows, cols, cells: [] };
        content.push(table);
        // tableLevel은 첫 TAG_LIST_HEADER가 오기 전까지 null — 실제 레벨로 확정됨
        stack.push({ table, cell: null, cellIndex: 0, tableLevel: null });
      }

    } else if (tag === TAG_LIST_HEADER && stack.length > 0) {
      const top = stack[stack.length - 1];
      if (top.tableLevel === null) top.tableLevel = level; // 첫 LIST_HEADER로 레벨 확정
      // 테이블 범위를 벗어나는 LIST_HEADER는 무시
      if (top.cellIndex >= top.table.rows * top.table.cols) continue;
      const row = Math.floor(top.cellIndex / top.table.cols);
      const col = top.cellIndex % top.table.cols;
      top.cell = { row, col, text: '' };
      top.table.cells.push(top.cell);
      top.cellIndex++;
    }
  }
  return content;
}

// ─────────────────────────────────────────────
// HTML 렌더링
// ─────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/// 텍스트를 HTML로 변환: 이미지 마커 → <img>, 줄바꿈 → <br>
function renderText(s) {
  return s
    .split(/\x02IMG:([^\x03]*)\x03/)
    .map((part, i) => i % 2 === 1
      ? `<img src="${part}" style="max-width:100%;height:auto">`
      : escHtml(part).replace(/\n/g, '<br>'))
    .join('');
}

// _paraContent 결과(parts + align)를 스타일 적용 HTML <p>로 변환
function _partsToHtml(parts, align) {
  const inner = parts.map(p => {
    if (p.type === 'image') return `<img src="${p.src}" style="max-width:100%;height:auto">`;
    let s = escHtml(p.value).replace(/\n/g, '<br>');
    if (!s) return '';
    if (p.color) s = `<span style="color:#${p.color}">${s}</span>`;
    if (p.bold) s = `<strong>${s}</strong>`;
    if (p.italic) s = `<em>${s}</em>`;
    if (p.underline) s = `<u>${s}</u>`;
    return s;
  }).join('');
  const alignStyle = align ? ` style="text-align:${align}"` : '';
  return `<p${alignStyle}>${inner}</p>`;
}

function contentToHtml(content, title) {
  const css = `
    body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
         font-size:11pt;line-height:1.7;margin:40px auto;max-width:900px;color:#111}
    h1{font-size:20pt;margin-top:1.5em}h2{font-size:16pt;margin-top:1.3em}
    h3{font-size:13pt;margin-top:1.1em}h4,h5,h6{font-size:11pt;margin-top:.9em}
    p{margin:.4em 0}
    table{border-collapse:collapse;width:100%;margin:1em 0}
    th,td{border:1px solid #555;padding:6px 10px;text-align:left;vertical-align:top}
    th{background:#f0f0f0;font-weight:700}
  `.trim();

  const parts = [];
  for (const block of content) {
    if (block.type === 'paragraph') {
      const text = block.text.trim();
      if (!text) continue;
      const level = HEADING_MAP[block.style];
      if (level) {
        // 헤딩은 <p> 래퍼 제거 후 <hN>으로
        const inner = block.html
          ? block.html.replace(/^<p[^>]*>/, '').replace(/<\/p>$/, '')
          : escHtml(text);
        parts.push(`<h${level}>${inner}</h${level}>`);
      } else {
        parts.push(block.html ?? `<p>${renderText(block.text)}</p>`);
      }
    } else if (block.type === 'image') {
      parts.push(`<p><img src="${block.src}" style="max-width:100%;height:auto"></p>`);
    } else if (block.type === 'table' && block.cells.length > 0) {
      const cellMap = {};
      for (const c of block.cells) cellMap[`${c.row},${c.col}`] = c;
      const occupied = new Set();
      let rows = '';
      for (let r = 0; r < block.rows; r++) {
        let rowHtml = '';
        for (let c = 0; c < block.cols; c++) {
          const k = `${r},${c}`;
          if (occupied.has(k)) continue;
          const cell = cellMap[k];
          if (!cell) { rowHtml += '<td></td>'; continue; }
          const rs = cell.rowSpan || 1;
          const cs = cell.colSpan || 1;
          for (let dr = 0; dr < rs; dr++) {
            for (let dc = 0; dc < cs; dc++) {
              if (dr > 0 || dc > 0) occupied.add(`${r+dr},${c+dc}`);
            }
          }
          const spanAttr = (rs > 1 ? ` rowspan="${rs}"` : '') + (cs > 1 ? ` colspan="${cs}"` : '');
          const cellContent = cell.html || renderText((cell.text || '').trim());
          rowHtml += `<td${spanAttr}>${cellContent}</td>`;
        }
        rows += `<tr>${rowHtml}</tr>`;
      }
      parts.push(`<table>${rows}</table>`);
    }
  }

  return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>${escHtml(title)}</title>
<style>${css}</style>
</head>
<body>
${parts.join('\n')}
</body>
</html>`;
}

// ─────────────────────────────────────────────
// 메인 파서
// ─────────────────────────────────────────────
async function parseHwp(arrayBuffer, filename) {
  const bytes = new Uint8Array(arrayBuffer);

  // HWPX는 ZIP 매직 바이트로 구분
  if (bytes[0] === 0x50 && bytes[1] === 0x4B) {
    return parseHwpx(arrayBuffer);
  }

  // cfb.js로 OLE 컨테이너 열기
  const cfb = CFB.read(bytes, { type: 'array' });

  // FileHeader 파싱
  const hdrEntry = CFB.find(cfb, 'FileHeader');
  if (!hdrEntry) throw new Error('FileHeader 스트림을 찾을 수 없습니다');

  const hdrData = new Uint8Array(hdrEntry.content);
  if (hdrData.length < 40) throw new Error('FileHeader가 너무 짧습니다');

  const sig = new TextDecoder().decode(hdrData.slice(0, 17));
  if (!sig.startsWith('HWP Document File')) throw new Error('유효한 HWP 파일이 아닙니다');

  const flags      = new DataView(hdrData.buffer).getUint32(36, true);
  const compressed = !!(flags & 1);
  const encrypted  = !!(flags & 2);
  const ver = hdrData.slice(32, 36);
  const version = `${ver[3]}.${ver[2]}.${ver[1]}.${ver[0]}`;

  if (encrypted) throw new Error('암호화된 파일은 지원하지 않습니다');

  // DocInfo → 스타일 맵
  let styles = {};
  const docEntry = CFB.find(cfb, 'DocInfo');
  if (docEntry) {
    let buf = new Uint8Array(docEntry.content);
    if (compressed) buf = await decompressRaw(buf);
    styles = parseStyles(buf);
  }

  // BinData 이미지 추출 (OLE 스트림에서 JPEG/PNG/GIF/BMP 감지)
  const images = [];
  for (const entry of (cfb.FileIndex || [])) {
    if (!entry || entry.type !== 2) continue;
    const name = (entry.name || '').toUpperCase();
    if (!name.includes('BIN')) continue;
    let raw = new Uint8Array(entry.content || []);
    if (!raw.length) continue;
    // zlib 압축 시도
    const decompressed = await decompressRaw(raw);
    // 원본과 길이가 다르면 압축 해제된 것 사용
    raw = decompressed.length > raw.length ? decompressed : raw;
    const mime = _detectImageMime(raw);
    if (mime) {
      const b64 = btoa(String.fromCharCode(...raw.slice(0, 10_000_000)));
      images.push(`data:${mime};base64,${b64}`);
    }
  }

  // BodyText/Section* 파싱
  const content = [];
  for (let i = 0; ; i++) {
    const entry = CFB.find(cfb, `Section${i}`);
    if (!entry) break;
    let buf = new Uint8Array(entry.content);
    if (compressed) buf = await decompressRaw(buf);
    content.push(...parseSection(buf, styles, images));
  }

  // 폴백: PrvText (미리보기 텍스트 스트림)
  if (content.length === 0) {
    const prvEntry = CFB.find(cfb, 'PrvText');
    if (prvEntry) {
      const text = new TextDecoder('utf-16le').decode(new Uint8Array(prvEntry.content));
      for (const line of text.split('\n')) {
        if (line.trim()) content.push({ type: 'paragraph', text: line, style: '' });
      }
    }
  }

  return { content, version };
}

function _detectImageMime(bytes) {
  if (bytes[0] === 0xFF && bytes[1] === 0xD8) return 'image/jpeg';
  if (bytes[0] === 0x89 && bytes[1] === 0x50) return 'image/png';
  if (bytes[0] === 0x47 && bytes[1] === 0x49) return 'image/gif';
  if (bytes[0] === 0x42 && bytes[1] === 0x4D) return 'image/bmp';
  if (bytes[0] === 0x52 && bytes[1] === 0x49) return 'image/webp'; // RIFF/WEBP
  return null;
}

// ─────────────────────────────────────────────
// HWPX (ZIP/XML) 파서
// ─────────────────────────────────────────────
async function parseHwpx(arrayBuffer) {
  const zip = await JSZip.loadAsync(arrayBuffer);

  // 스타일 맵: styleIDRef → 스타일 이름 (header.xml에서 추출)
  const styles = {};
  const headerFile = zip.file('Contents/header.xml');
  if (headerFile) {
    const xml = await headerFile.async('string');
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    for (const el of doc.getElementsByTagName('*')) {
      if (el.localName === 'style') {
        const id = el.getAttribute('id');
        const name = el.getAttribute('name');
        if (id !== null && name) styles[id] = name;
      }
    }
  }

  // 섹션 파일 목록 (Contents/section0.xml, section1.xml, …)
  const sectionFiles = Object.keys(zip.files)
    .filter(n => /Contents\/section\d+\.xml$/i.test(n))
    .sort((a, b) => {
      const num = s => parseInt(s.match(/(\d+)\.xml$/)?.[1] ?? '0');
      return num(a) - num(b);
    });

  // BinData 이미지 추출 (ZIP 안의 이미지 파일들)
  const images = {};  // filename → data URI
  for (const [name, file] of Object.entries(zip.files)) {
    if (file.dir) continue;
    const lower = name.toLowerCase();
    const mimeMap = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png',
                      gif: 'image/gif',  bmp: 'image/bmp',  webp: 'image/webp' };
    const ext = lower.split('.').pop();
    if (!mimeMap[ext]) continue;
    const bytes = await file.async('uint8array');
    const b64 = btoa(String.fromCharCode(...bytes));
    images[name] = `data:${mimeMap[ext]};base64,${b64}`;
  }

  // content.hpf 에서 binaryItemID → 파일 경로 매핑 파싱
  const binMap = {};  // id → data URI
  const hpfFile = zip.file('Contents/content.hpf') || zip.file(/\.hpf$/i)?.[0];
  if (hpfFile) {
    const hpfXml = await hpfFile.async('string');
    const hpfDoc = new DOMParser().parseFromString(hpfXml, 'text/xml');
    for (const el of hpfDoc.getElementsByTagName('*')) {
      if (el.localName === 'item' || el.localName === 'manifest-item') {
        const id   = el.getAttribute('id') || el.getAttribute('ID');
        const href = el.getAttribute('href') || el.getAttribute('HREF') || '';
        const fullPath = 'Contents/' + href.replace(/^\.\//, '');
        if (id && images[fullPath]) binMap[id] = images[fullPath];
        if (id && images[href])     binMap[id] = images[href];
      }
    }
  }

  const content = [];
  for (const filename of sectionFiles) {
    const xmlStr = await zip.files[filename].async('string');
    const xmlDoc = new DOMParser().parseFromString(xmlStr, 'text/xml');
    _parseSectionXml(xmlDoc.documentElement, styles, content, binMap);
  }

  return { content, version: 'HWPX' };
}

// <p> 요소가 <tbl>/<tc> 안에 있는지 확인 (레거시 — 더 이상 호출되지 않음)
function _isInsideTable(el, root) {
  let p = el.parentElement;
  while (p && p !== root) {
    if (p.localName === 'tc' || p.localName === 'tbl') return true;
    p = p.parentElement;
  }
  return false;
}

function _parseSectionXml(root, styles, content, binMap = {}) {
  for (const child of root.children) {
    const ln = child.localName;
    if (ln === 'p') {
      _processPara(child, styles, content, binMap);
    } else if (ln === 'tbl') {
      _processTable(child, styles, content, binMap);
    } else {
      _parseSectionXml(child, styles, content, binMap);
    }
  }
}

function _processPara(pEl, styles, content, binMap = {}) {
  const tblChild = Array.from(pEl.getElementsByTagName('*')).find(e => e.localName === 'tbl');
  if (tblChild) {
    _processTable(tblChild, styles, content, binMap);
    return;
  }
  const styleRef = pEl.getAttribute('styleIDRef') ?? '0';
  const { parts, align } = _paraContent(pEl, binMap);

  // parts가 이미지만 있는 경우 image 블록으로, 텍스트 포함 시 paragraph로
  const hasImg  = parts.some(p => p.type === 'image');
  const hasText = parts.some(p => p.type === 'text' && p.value.trim());

  if (!hasImg && !hasText) return;

  if (hasImg && !hasText) {
    for (const p of parts) {
      if (p.type === 'image') content.push({ type: 'image', src: p.src });
    }
  } else {
    const text = parts.map(p =>
      p.type === 'image' ? `\x02IMG:${p.src}\x03` : p.value
    ).join('');
    const html = _partsToHtml(parts, align);
    content.push({ type: 'paragraph', text, html, style: styles[styleRef] ?? '' });
  }
}

// 단락 내 콘텐츠를 { type:'text', value, bold?, italic?, underline?, color? } | { type:'image', src } 배열로 반환
// { parts, align } 형태로 반환
function _paraContent(pEl, binMap) {
  let align = null;
  for (const el of pEl.getElementsByTagName('*')) {
    if (el.localName === 'paraPr') {
      const alignEl = Array.from(el.children).find(c => c.localName === 'align');
      if (alignEl) {
        const v = alignEl.textContent?.trim().toLowerCase();
        if (v === 'center' || v === 'right' || v === 'justify') align = v;
      }
      if (!align) {
        const v = (el.getAttribute('align') || '').toLowerCase();
        if (v === 'center' || v === 'right' || v === 'justify') align = v;
      }
      break;
    }
  }

  const parts = [];
  for (const el of pEl.getElementsByTagName('*')) {
    const ln = el.localName;
    if (ln === 't') {
      const run = el.parentElement;
      const fmt = {};
      if (run && run.localName === 'run') {
        const charPr = Array.from(run.children).find(c => c.localName === 'charPr');
        if (charPr) {
          if (charPr.getAttribute('bold') === '1') fmt.bold = true;
          if (charPr.getAttribute('italic') === '1') fmt.italic = true;
          if (charPr.getAttribute('underline') === '1') fmt.underline = true;
          const color = charPr.getAttribute('fontColor') ||
                        charPr.getAttribute('textColor') ||
                        charPr.getAttribute('color');
          if (color && color !== '000000' && color !== '#000000') {
            fmt.color = color.replace(/^#/, '');
          }
        }
      }
      parts.push({ type: 'text', value: el.textContent ?? '', ...fmt });
    } else if (ln === 'img' || ln === 'pic') {
      const ref = el.getAttribute('binaryItemIDRef') ||
                  el.getAttribute('itemIDRef') ||
                  el.getAttribute('href') || '';
      const src = binMap[ref] || binMap['Contents/' + ref] || '';
      if (src) parts.push({ type: 'image', src });
    }
  }
  return { parts, align };
}

function _paraText(pEl) {
  const parts = [];
  for (const el of pEl.getElementsByTagName('*')) {
    if (el.localName === 't') parts.push(el.textContent ?? '');
  }
  return parts.join('');
}

function _collectCellContent(el, binMap) {
  let text = '';
  const htmlParts = [];
  const nestedTables = [];
  for (const child of el.children) {
    const ln = child.localName;
    if (ln === 'p') {
      const { parts, align } = _paraContent(child, binMap);
      const line = parts.map(pt => pt.type === 'image' ? `\x02IMG:${pt.src}\x03` : pt.value).join('');
      if (line.trim()) {
        text += (text ? '\n' : '') + line;
        htmlParts.push(_partsToHtml(parts, align));
      }
    } else if (ln === 'tbl') {
      nestedTables.push(child);
    } else {
      const { text: t, html: h, nestedTables: nt } = _collectCellContent(child, binMap);
      if (t) text += (text ? '\n' : '') + t;
      if (h) htmlParts.push(h);
      nestedTables.push(...nt);
    }
  }
  return { text, html: htmlParts.join(''), nestedTables };
}

function _processTable(tblEl, styles, content, binMap = {}) {
  // .children 으로 직접 자식 <tr>만 — getElementsByTagName 쓰면 중첩 테이블의 행까지 포함됨
  const trs = Array.from(tblEl.children).filter(c => c.localName === 'tr');
  if (!trs.length) return;

  const cols = Math.max(...trs.map(tr =>
    Array.from(tr.children).filter(c => c.localName === 'tc').length
  ), 1);

  const table = { type: 'table', rows: trs.length, cols, cells: [] };
  content.push(table);

  trs.forEach((tr, ri) => {
    Array.from(tr.children)
      .filter(c => c.localName === 'tc')
      .forEach((tc, ci) => {
        const addr = Array.from(tc.getElementsByTagName('*')).find(c => c.localName === 'cellAddr');
        const row = addr ? parseInt(addr.getAttribute('r') ?? ri) : ri;
        const col = addr ? parseInt(addr.getAttribute('c') ?? ci) : ci;
        const rowSpan = addr ? (parseInt(addr.getAttribute('rowSpan') || addr.getAttribute('rowspan') || '1') || 1) : 1;
        const colSpan = addr ? (parseInt(addr.getAttribute('colSpan') || addr.getAttribute('colspan') || '1') || 1) : 1;

        // <subList> 같은 래퍼를 재귀 탐색하여 <p> 텍스트 수집, <tbl>은 별도 처리
        const { text: cellText, html: cellHtml, nestedTables } = _collectCellContent(tc, binMap);

        table.cells.push({ row, col, rowSpan, colSpan, text: cellText, html: cellHtml });

        // 중첩 테이블은 content 에 별도 블록으로 추가
        for (const nested of nestedTables) {
          _processTable(nested, styles, content, binMap);
        }
      });
  });
}

// ─────────────────────────────────────────────
// UI 상태 관리
// ─────────────────────────────────────────────
let currentHtml = '';
let currentFilename = '';

function setStatus(type, message) {
  const el = document.getElementById('status');
  el.className = type;
  el.style.display = type ? 'flex' : 'none';
  el.innerHTML = type === 'loading'
    ? `<div class="spinner"></div><span>${message}</span>`
    : `<span>${message}</span>`;
}

function showResult(content, version, filename) {
  const title = filename.replace(/\.hwpx?$/i, '');
  currentHtml = contentToHtml(content, title);
  currentFilename = title + '.html';

  const paraCount  = content.filter(b => b.type === 'paragraph').length;
  const tableCount = content.filter(b => b.type === 'table').length;

  document.getElementById('metaRow').innerHTML = `
    <div class="meta-chip">버전 <strong>${version}</strong></div>
    <div class="meta-chip">단락 <strong>${paraCount}개</strong></div>
    <div class="meta-chip">표 <strong>${tableCount}개</strong></div>
  `;

  const frame = document.getElementById('previewFrame');
  frame.srcdoc = currentHtml;

  document.getElementById('result').style.display = 'block';
}

function downloadHtml() {
  const blob = new Blob([currentHtml], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentFilename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function resetApp() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('status').style.display = 'none';
  document.getElementById('fileInput').value = '';
  currentHtml = '';
  currentFilename = '';
}

// ─────────────────────────────────────────────
// 파일 처리
// ─────────────────────────────────────────────
async function processFile(file) {
  if (!file) return;
  if (!/\.(hwp|hwpx)$/i.test(file.name)) {
    setStatus('error', '❌ HWP 또는 HWPX 파일만 지원합니다');
    return;
  }

  document.getElementById('result').style.display = 'none';
  setStatus('loading', `${file.name} 변환 중…`);

  try {
    const buf = await file.arrayBuffer();
    const { content, version } = await parseHwp(buf, file.name);

    if (content.length === 0) {
      setStatus('error', '⚠️ 텍스트를 추출할 수 없었습니다. 파일이 손상되었거나 지원하지 않는 형식일 수 있습니다.');
      return;
    }

    setStatus('success', `✅ 변환 완료 — ${file.name}`);
    showResult(content, version, file.name);
  } catch (e) {
    setStatus('error', `❌ ${e.message}`);
  }
}

// ─────────────────────────────────────────────
// 드래그앤드롭 / 파일 선택
// ─────────────────────────────────────────────
function onDragOver(e) {
  e.preventDefault();
  document.getElementById('dropzone').classList.add('drag-over');
}
function onDragLeave() {
  document.getElementById('dropzone').classList.remove('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  document.getElementById('dropzone').classList.remove('drag-over');
  processFile(e.dataTransfer.files[0]);
}
function onFileSelected(e) {
  processFile(e.target.files[0]);
}
</script>
